# Eorzean Night theme. See STYLING.md for the full palette and usage rules.
[theme]
base = "dark"
primaryColor = "#D4A843"             # Eorzean gold - accents, active widgets, links
backgroundColor = "#0B0F14"          # near-black slate - page background
secondaryBackgroundColor = "#151B24" # panels, sidebar, metric cards
textColor = "#E8EDF4"
font = "Inter, sans serif"
baseRadius = "12"
